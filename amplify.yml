version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - node scripts/verify-production-env.mjs --production
    build:
      commands:
        - |
          if [ -z "$VITE_ATLAS_API_URL" ]; then
            echo "WARNING: VITE_ATLAS_API_URL is not set. Model uploads will fail until you add it in Amplify Environment variables and redeploy."
          else
            echo "VITE_ATLAS_API_URL is set for this build."
          fi
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
  customRedirects:
    # Apex → www (also set in Amplify Console; Console edits override yml until re-saved)
    - source: "https://atlasar.in"
      target: "https://www.atlasar.in"
      status: "301"
    - source: "https://atlasar.in/"
      target: "https://www.atlasar.in/"
      status: "301"
    # No trailing slash on marketing/legal (strip before SPA rewrite)
    - source: "/pricing/"
      target: "/pricing"
      status: "301"
    - source: "/about/"
      target: "/about"
      status: "301"
    - source: "/legal/terms/"
      target: "/legal/terms"
      status: "301"
    - source: "/legal/privacy/"
      target: "/legal/privacy"
      status: "301"
    - source: "/legal/acceptable-use/"
      target: "/legal/acceptable-use"
      status: "301"
    # Static enablement pages (must be before SPA rewrite)
    - source: "/sales-deck"
      target: "/sales-deck/index.html"
      status: "200"
    - source: "/sales-deck/"
      target: "/sales-deck/index.html"
      status: "200"
    - source: "/sales-deck.html"
      target: "/sales-deck/index.html"
      status: "200"
    - source: "/sales-deck/training"
      target: "/sales-deck/training.html"
      status: "200"
    - source: "/sales-deck/training/"
      target: "/sales-deck/training.html"
      status: "200"
    - source: "/sales-deck/outreach"
      target: "/sales-deck/outreach.html"
      status: "200"
    - source: "/sales-deck/outreach/"
      target: "/sales-deck/outreach.html"
      status: "200"
    - source: "/mkt-3-storyboard"
      target: "/mkt-3-storyboard/index.html"
      status: "200"
    - source: "/mkt-3-storyboard/"
      target: "/mkt-3-storyboard/index.html"
      status: "200"
    # SPA rewrite with 200 (not 404-200) so Amplify does not add trailing slash on miss
    - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|jpeg|js|png|txt|svg|woff|woff2|ttf|map|json|webp|mp4|xml|webmanifest|html)$)([^.]+$)/>'
      target: "/index.html"
      status: "200"
  customHeaders:
    - pattern: "**/*"
      headers:
        - key: Strict-Transport-Security
          value: max-age=31536000; includeSubDomains
        - key: X-Content-Type-Options
          value: nosniff
        - key: X-Frame-Options
          value: DENY
        - key: Referrer-Policy
          value: strict-origin-when-cross-origin
        - key: Content-Security-Policy
          value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.amazonaws.com https://*.amazoncognito.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://*.amazonaws.com https://*.amazoncognito.com wss:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
