name: Deploy Atlas WebXR to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-atlas-webxr
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # Using Node 22 fixes the deprecation warning!

      - name: Install Dependencies
        run: |
          if [ -d "atlas-webxr" ]; then
            cd atlas-webxr && npm ci
          else
            npm ci
          fi

      - name: Build Project
        run: |
          if [ -d "atlas-webxr" ]; then
            cd atlas-webxr && npm run build
          else
            npm run build
          fi

      - name: Upload Build Output
        uses: actions/upload-pages-artifact@v3
        with:
          path: |
            dist
            atlas-webxr/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
