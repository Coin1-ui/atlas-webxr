name: Deploy Atlas WebXR to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "atlas-webxr/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-atlas-webxr
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: atlas-webxr/package-lock.json
      - run: npm ci
        working-directory: atlas-webxr
      - run: npm run build
        working-directory: atlas-webxr
      - uses: actions/upload-pages-artifact@v3
        with:
          path: atlas-webxr/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
