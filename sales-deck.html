<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050a14" />
    <meta
      name="description"
      content="Atlas AR sales deck — white-label browser floor AR from $5/mo. Interactive 10-slide presentation."
    />
    <title>Atlas AR — Sales Deck</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/sales-deck/deck.css" />
  </head>
  <body>
    <canvas id="webgl-bg" aria-hidden="true"></canvas>

    <div class="deck-shell">
      <header class="deck-toolbar">
        <div class="deck-brand">Atlas <span>AR</span> · Sales deck</div>
        <div class="deck-toolbar-actions">
          <a class="deck-btn deck-btn-training" href="/sales-deck/training.html" title="SAL-3 sales team training">Training</a>
          <a class="deck-btn deck-btn-outreach" href="/sales-deck/outreach.html" title="SAL-2 design partner outreach">Outreach</a>
          <button type="button" class="deck-btn" id="btn-help" title="Keyboard shortcuts">?</button>
          <button type="button" class="deck-btn" id="btn-notes" title="Speaker notes (N)">Notes</button>
          <button type="button" class="deck-btn" id="btn-fullscreen" title="Fullscreen (F)">Fullscreen</button>
          <button type="button" class="deck-btn" id="btn-prev" aria-label="Previous slide">←</button>
          <span class="deck-counter" id="slide-counter">1 / 10</span>
          <button type="button" class="deck-btn" id="btn-next" aria-label="Next slide">→</button>
        </div>
      </header>

      <main class="deck-main">
        <div class="deck-stage-wrap">
          <div class="deck-stage" id="deck-stage" role="region" aria-label="Sales presentation slides"></div>
        </div>
      </main>

      <nav class="deck-dots" id="deck-dots" aria-label="Slide navigation"></nav>
    </div>

    <aside class="notes-panel" id="notes-panel" aria-label="Speaker notes">
      <h4>Speaker notes</h4>
      <p id="notes-text"></p>
    </aside>

    <div class="deck-help" id="deck-help" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts">
      <div class="deck-help-inner">
        <h2>Navigation</h2>
        <ul>
          <li><kbd>→</kbd> <kbd>Space</kbd> Next slide</li>
          <li><kbd>←</kbd> Previous slide</li>
          <li><kbd>Home</kbd> / <kbd>End</kbd> First / last slide</li>
          <li><kbd>N</kbd> Toggle speaker notes</li>
          <li><kbd>F</kbd> Fullscreen</li>
          <li><kbd>?</kbd> This help</li>
          <li>Swipe left / right on touch devices</li>
        </ul>
        <p style="margin-top: 16px">
          <button type="button" class="deck-btn" id="btn-help-close">Close</button>
        </p>
      </div>
    </div>

    <script type="module" src="/sales-deck/deck.js"></script>
  </body>
</html>
